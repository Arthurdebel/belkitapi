<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Livechat</title>
    <style>
      body{font-family:Arial,sans-serif;background:#f5f5f5;margin:0;padding:20px}
      .container{max-width:900px;margin:0 auto;background:#fff;border-radius:8px;box-shadow:0 2px 10px rgba(0,0,0,.08);padding:20px}
      .row{display:flex;gap:16px}
      .col{flex:1}
      .panel{border:1px solid #eee;border-radius:8px;padding:16px}
      .qr{display:flex;flex-direction:column;align-items:center;gap:8px}
      .qr img{max-width:260px}
      .log{height:200px;overflow:auto;background:#fafafa;border:1px solid #eee;border-radius:6px;padding:8px;font-size:12px}
      .chat{height:360px;overflow:auto;background:#fafafa;border:1px solid #eee;border-radius:6px;padding:8px}
      .input{display:flex;gap:8px;margin-top:8px}
      input,button{padding:8px;border-radius:6px;border:1px solid #ddd}
      button{background:#007bff;color:#fff;border-color:#007bff;cursor:pointer}
      button:disabled{opacity:.6;cursor:not-allowed}
      .badge{display:inline-block;padding:4px 8px;border-radius:999px;font-size:12px;background:#eee}
    </style>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js" crossorigin="anonymous"></script>
  </head>
  <body>
    <div class="container">
      <h2>Livechat - Cadastro de Número e Chat em Tempo Real</h2>
      <div class="row">
        <div class="col">
          <div class="panel">
            <h3>Registrar número</h3>
            <div>
              <label>Token/Número:</label>
              <input id="token" placeholder="ex: 5599999999999" style="width:100%">
            </div>
            <div style="margin-top:8px;display:flex;gap:8px">
              <button id="btnRegister">Gerar QR</button>
              <button id="btnStatus">Status</button>
              <button id="btnLogout">Logout</button>
              <span id="status" class="badge">idle</span>
            </div>
            <div class="qr" style="margin-top:12px">
              <img id="qr" alt="QR" hidden>
              <small id="qrMsg"></small>
            </div>
            <div style="margin-top:12px">
              <div class="log" id="log"></div>
            </div>
          </div>
        </div>
        <div class="col">
          <div class="panel">
            <h3>Chat</h3>
            <div class="chat" id="chat"></div>
            <div class="input">
              <input id="to" placeholder="Destino (msisdn)">
              <input id="text" placeholder="Mensagem">
              <button id="send">Enviar</button>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script>
      const apiBase = location.origin.replace(/\/$/,'');
      let socket;
      let currentToken;

      function setStatus(s){ document.getElementById('status').textContent=s }
      function log(msg){ const el=document.getElementById('log'); const t=new Date().toLocaleTimeString(); el.innerHTML+=`[${t}] ${msg}<br>`; el.scrollTop=el.scrollHeight }
      function showQR(dataUrl,msg){ const img=document.getElementById('qr'); const m=document.getElementById('qrMsg'); if(dataUrl){ img.src=dataUrl; img.hidden=false; m.textContent=msg||'' } else { img.hidden=true; m.textContent='' } }

      function ensureSocket(){
        if(socket) return;
        socket = io(apiBase, { path: '/socket.io' });
        socket.on('connect', ()=>{ log('socket connected '+socket.id); if(currentToken) socket.emit('join', currentToken) })
        socket.on('disconnect', ()=> log('socket disconnected'))
        
        // Eventos em tempo real da VPS
        socket.on('qr', (data)=>{
          if(data.qrcode) {
            showQR(data.qrcode, data.message);
            setStatus('qrcode');
            log('QR recebido em tempo real');
          }
        });
        
        socket.on('connected', (data)=>{
          setStatus('connected');
          showQR(null);
          log('Dispositivo conectado em tempo real!');
        });
        
        socket.on('disconnected', (data)=>{
          setStatus('disconnected');
          showQR(null);
          log('Dispositivo desconectado');
        });
        
        socket.on('message', (data)=>{
          const c=document.getElementById('chat');
          const t=new Date().toLocaleTimeString();
          c.innerHTML+=`<div>[${t}] <b>${data.from || 'Sistema'}</b>: ${data.text || JSON.stringify(data)}</div>`;
          c.scrollTop=c.scrollHeight;
        });
      }

      async function post(url, body){
        const r = await fetch(url, { method:'POST', headers:{ 'Content-Type':'application/json' }, body: JSON.stringify(body||{}) });
        return r.json();
      }

      document.getElementById('btnRegister').onclick = async () => {
        const token = document.getElementById('token').value.trim();
        if(!token) return alert('Informe o token (número)');
        ensureSocket(); currentToken = token; socket.emit('join', token);
        setStatus('processing'); log('Registrando '+token);
        const res = await post(apiBase + '/api/register', { token });
        if(res.status===true){ setStatus('connected'); showQR(null); log('Conectado'); }
        else if(res.status==='qrcode'){ setStatus('qrcode'); showQR(res.qrcode, res.message); log('QR pronto, escaneie no WhatsApp'); }
        else if(res.status==='processing'){ setStatus('processing'); showQR(null); log('Processando...'); }
        else { setStatus('error'); showQR(null); log('Falhou: '+(res.message||'erro')) }
      }

      document.getElementById('btnStatus').onclick = async () => {
        const token = document.getElementById('token').value.trim(); if(!token) return;
        const res = await post(apiBase + '/api/status', { token });
        if(res.status===true){ setStatus('connected'); showQR(null); log('Conectado'); }
        else if(res.status==='qrcode'){ setStatus('qrcode'); showQR(res.qrcode, res.message); log('QR atualizado'); }
        else { setStatus('disconnected'); showQR(null); log(res.message||'Desconectado') }
      }

      document.getElementById('btnLogout').onclick = async () => {
        const token = document.getElementById('token').value.trim(); if(!token) return;
        const res = await post(apiBase + '/api/logout', { token });
        setStatus('idle'); showQR(null); log('Logout: '+(res.message||'ok'))
      }

      document.getElementById('send').onclick = async () => {
        const token = document.getElementById('token').value.trim();
        const to = document.getElementById('to').value.trim();
        const text = document.getElementById('text').value.trim();
        if(!token||!to||!text) return alert('Informe token, destino e texto');
        try{
          // Se o chat.js expõe evento para enviar, você pode criar um endpoint; aqui apenas emitimos um evento
          if(socket) socket.emit('chat:send', { token, to, text });
          log('Enviado para '+to+': '+text);
        }catch(e){ log('Erro ao enviar: '+e.message) }
      }
    </script>
  </body>
  </html>
